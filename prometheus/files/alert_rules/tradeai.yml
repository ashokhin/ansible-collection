#
# Please do not change this file directly since it is managed by Ansible and will be overwritten.
#
groups:
  - name: TradeAI
    rules:

      # changes() is intentional here: we want to detect any value change,
      # and the "> 0" guard on qty prevents false alerts on bot restart (reset to 0).

      - alert: TradeAIBuy
        expr: >
          (tradeai_last_trade_qty{action="BUY"} > 0)
          and
          (changes(tradeai_last_trade_qty{action="BUY"}[11m]) > 0)
        annotations:
          title: '🟢 AI Bot: BUY executed'
          description: 'Bought {{ $value | printf "%.6f" }} units ({{ $labels.asset }})'
        labels:
          severity: info

      - alert: TradeAISell
        expr: >
          (tradeai_last_trade_qty{action="SELL"} > 0)
          and
          (changes(tradeai_last_trade_qty{action="SELL"}[11m]) > 0)
        annotations:
          title: '🔵 AI Bot: SELL executed'
          description: 'Sold {{ $value | printf "%.6f" }} units ({{ $labels.asset }})'
        labels:
          severity: info

      - alert: TradeAITakeProfit
        expr: >
          (tradeai_last_trade_qty{action="TAKE_PROFIT"} > 0)
          and
          (changes(tradeai_last_trade_qty{action="TAKE_PROFIT"}[11m]) > 0)
        annotations:
          title: '💰 AI Bot: TAKE PROFIT triggered'
          description: 'Take-profit exit: sold {{ $value | printf "%.6f" }} units ({{ $labels.asset }})'
        labels:
          severity: info

      - alert: TradeAIStopLoss
        # delta() > 0: fires only when stop_losses_total actually increased.
        # Result value is cooldown_days so the annotation shows the actual configured cooldown.
        expr: >
          tradeai_strategy_cooldown_days
          and on(job, instance, asset)
          (delta(tradeai_stop_losses_total[11m]) > 0)
        annotations:
          title: '🔴 AI Bot: STOP LOSS triggered'
          description: 'Stop-loss exit for {{ $labels.asset }}. BUY blocked for {{ $value | printf "%.0f" }} days.'
        labels:
          severity: warning

      - alert: TradeAICircuitBreaker
        expr: tradeai_circuit_breaker == 1
        annotations:
          title: '⛔ AI Bot: circuit breaker triggered'
          description: 'Portfolio drawdown exceeded circuit_breaker_pct threshold for {{ $labels.asset }}. New trades halted until recovery or restart.'
        labels:
          severity: critical

      - alert: TradeAIDown
        expr: (time() - tradeai_last_cycle_timestamp) > 7200
        for: 5m
        annotations:
          title: '⚠️ AI Bot: no cycle for 2+ hours'
          description: 'Last cycle {{ $value | printf "%.0f" }}s ago. Check: systemctl status tradeai'
        labels:
          severity: critical

      - alert: TradeAIHighErrors
        # delta() > 3: fires only when errors actually increased by more than 3 in 1h.
        # changes() would also fire if the value decreased (e.g. after restart), which is wrong.
        expr: delta(tradeai_errors_total[1h]) > 3
        for: 5m
        annotations:
          title: '⚠️ AI Bot: high error rate'
          description: 'More than 3 failed cycles in the last hour for {{ $labels.asset }}. Check: journalctl -u {{ $labels.job }} -n 50'
        labels:
          severity: warning

      - alert: TradeAITradingPaused
        # changes() > 0 on the 0->1 edge only (tradeai_trading_paused == 1 guard): fires once
        # when the optimizer's Sharpe drops below min_sharpe_to_trade, not on every cycle while
        # still paused. Result value is the current Sharpe ratio, not the paused flag itself.
        expr: >
          tradeai_dynamic_sharpe
          and on(job, instance, asset)
          ((tradeai_trading_paused == 1) and (changes(tradeai_trading_paused[11m]) > 0))
        annotations:
          title: '⏸️ AI Bot: trading paused (low Sharpe)'
          description: 'New BUYs blocked for {{ $labels.asset }}: optimizer Sharpe is {{ $value | printf "%.2f" }}, below min_sharpe_to_trade. Open positions still managed normally.'
        labels:
          severity: warning

      - alert: TradeAITradingResumed
        # Mirror of TradeAITradingPaused: fires once on the 1->0 edge.
        expr: >
          tradeai_dynamic_sharpe
          and on(job, instance, asset)
          ((tradeai_trading_paused == 0) and (changes(tradeai_trading_paused[11m]) > 0))
        annotations:
          title: '▶️ AI Bot: trading resumed'
          description: 'New BUYs re-enabled for {{ $labels.asset }}: optimizer Sharpe recovered to {{ $value | printf "%.2f" }}.'
        labels:
          severity: warning
